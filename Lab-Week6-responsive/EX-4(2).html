<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex-4 clamp</title>
<style>
    .wrapper {
      padding: 20px;
    }
    .content {
      background-color: yellow;
      height: 300px;
      width: clamp(300px, 100%, 800px);
    }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="content"></div>
  </div>
</body>
</html>
